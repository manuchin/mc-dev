<meta name="theme-color" content="#0a0a0a" />
<meta name="color-scheme" content="dark light" />
<script>
  /* Anti-flash: aplica el tema antes del primer render (default: automático). */
  (function () {
    var mode = "auto";
    try {
      var saved = localStorage.getItem("mc-theme");
      if (saved === "light" || saved === "dark" || saved === "auto") mode = saved;
    } catch (e) {}
    var dark = mode === "dark" || (mode === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
    var el = document.documentElement;
    el.classList.add(dark ? "dark" : "light");
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", dark ? "#0a0a0a" : "#f7f7f5");
  })();
</script>
